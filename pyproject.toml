[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grpo-mbpp"
version = "0.1.0"
description = "A small GRPO experiment for Python code generation on MBPP."
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "torch>=2.2",
  "transformers>=4.50",
  "trl>=0.15",
  "wandb>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
