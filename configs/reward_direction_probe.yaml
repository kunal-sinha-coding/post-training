# This configuration runs one 16-generation GRPO update and records reward and likelihood direction diagnostics.
model_name_or_path: Qwen/Qwen2.5-Coder-3B-Instruct
dataset_name: google-research-datasets/mbpp
dataset_config: null
mbpp_splits: [train, validation, test]
evalplus_dataset_name: evalplus/mbppplus
evalplus_split: test
synthetic_tests_enabled: false
seed: 42
max_train_samples: 8
max_eval_samples: null
train_subset_evaluation_only: true
run_baseline_evaluation: false
reuse_baseline: false
run_intermediate_evals: false
run_qwen_evalplus_at_start: false
evalplus_eval_steps: 8
lora_enabled: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
sft_enabled: false
log_path: logs/logs.txt
results_log_path: logs/results.txt
output_dir: outputs/grpo-mbpp-synthetic-direction-probe-g16x8
reward_trace_path: outputs/grpo-mbpp-synthetic-direction-probe-g16x8/reward-trace.jsonl
synthetic_reward_probe: true
probe_update_direction: true
temperature: 1.0
num_train_epochs: 1
max_steps: 4
per_device_train_batch_size: 1
gradient_accumulation_steps: 128
generation_batch_size: 128
learning_rate: 0.000003
lr_scheduler_type: constant
num_generations: 16
beta: 0.0
max_prompt_length: 512
max_completion_length: 2048
logging_steps: 1
save_steps: 1
eval_steps: 1
best_checkpoint_metric: pass@1
checkpoint_eval_patience: 0
evaluation_batch_size: 8
evaluation_num_completions: 1
sandbox_timeout_seconds: 3
trust_remote_code: false
bf16: true
fp16: false
report_to: wandb
wandb_project: grpo-mbpp
wandb_run_name: grpo-mbpp-synthetic-direction-probe-g16x8
reward_function: hybrid
reward_coefficient: 0.5
reward_rolling_window: 10
