# This configuration runs reference-solution SFT on the full MBPP training pool.
# It samples 16 completions for every training task every ten optimizer steps and stops when coverage reaches one.
model_name_or_path: outputs/evalplus-pass16-mbpphard10x1009-seed42-20261011/base-model
mbpp_splits: [train, validation, test]
visible_test_count: 1
synthetic_training_tasks_path: null
expected_train_samples: 591
output_dir: outputs/reference-sft-fullpool-sampled-eval-20261018
seed: 42
device: cuda
bf16: true
fp16: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
sft_per_device_train_batch_size: 16
gradient_accumulation_steps: 1
learning_rate: 0.00001
max_prompt_length: 512
max_completion_length: 512
max_new_tokens: 512
temperature: 0.8
sandbox_timeout_seconds: 3
reward_scoring_workers: 32
torch_num_threads: 8
dataloader_num_workers: 2
gradient_checkpointing: true
full_epochs: 10000
logging_steps: 10
save_steps: 100
run_baseline_evaluation: false
sampled_training_eval_enabled: true
sampled_training_eval_steps: 10
sampled_training_eval_num_samples: 16
sampled_training_eval_temperature: 1.0
sampled_training_eval_stop_on_full_coverage: true
vllm_gpu_memory_utilization: 0.5
wandb_project: grpo-mbpp
wandb_entity: kunal-personal
full_wandb_run_name: mbpp-reference-sft-fullpool-sampled-eval-20261018
