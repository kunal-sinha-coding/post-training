# This config fine-tunes on one saved passing greedy completion per original or easy synthetic task.
model_name_or_path: outputs/evalplus-pass16-mbpphard10x1009-seed42-20261011/base-model
mbpp_splits: [train, validation, test]
visible_test_count: 1
synthetic_training_tasks:
  - path: analysis/mbpp_category_synthetic_tasks_api10x.jsonl
    namespace: easy
output_dir: outputs/rejection-sampling-original-easy-one-shot-20261013
solution_store_path: outputs/rejection-sampling-original-easy-one-shot-20261013/solutions.json
seed: 42
device: cuda
bf16: true
fp16: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
candidate_batch_size: 1
max_generation_batches_per_task: 1
generation_batch_size: 128
generation_backend: vllm
collection_between_epochs: none
training_eval_sample_size: 500
training_eval_sample_seed: 42
vllm_gpu_memory_utilization: 0.7
vllm_max_model_len: 1536
vllm_max_num_batched_tokens: 16384
collection_task_batch_size: 64
max_new_tokens: 512
temperature: 0.0
top_p: 1.0
sandbox_timeout_seconds: 3
reward_scoring_workers: 32
torch_num_threads: 8
sft_per_device_train_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 0.00001
max_prompt_length: 512
max_completion_length: 512
dataloader_num_workers: 8
target_steps: 1000000
logging_steps: 10
evaluation_interval_steps: 100
save_candidate_details: false
report_to: wandb
wandb_project: grpo-mbpp
wandb_entity: kunal-personal
wandb_full_collect_run_name: mbpp-rs-original-easy-one-shot-collection-20261013
wandb_full_train_run_name: mbpp-rs-original-easy-one-shot-training-20261013
